  <circle cx="1300" cy="300" r="400" fill="url(#amber)"/>
    <rect x="380" y="180" width="240" height="110" rx="16" fill="#123b38" stroke="#7ccdc1" stroke-opacity="0.7" stroke-width="3"/>
